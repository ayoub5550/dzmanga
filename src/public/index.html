<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>dzmanga — مانجا عربي</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0d0f14; --bg2:#151821; --card:#1b1f2b; --text:#eef1f7; --muted:#8a90a2;
    --accent:#ff4d6d; --accent2:#7c5cff; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Tahoma","Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:10;background:rgba(13,15,20,.9);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1f2330}
  header .logo{font-weight:800;font-size:20px;letter-spacing:.3px}
  header .logo span{color:var(--accent)}
  header form{flex:1;display:flex}
  header input{flex:1;background:var(--bg2);border:1px solid #2a2f3d;color:var(--text);
    padding:10px 14px;border-radius:999px;font-size:14px;outline:none;text-align:right}
  header input:focus{border-color:var(--accent2)}
  main{max-width:1100px;margin:0 auto;padding:16px}
  h2.section{font-size:16px;margin:22px 4px 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;position:relative;
    transition:transform .15s ease}
  .card:active{transform:scale(.97)}
  .card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
  .card .title{font-size:12.5px;padding:8px 8px 10px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .loading, .empty{color:var(--muted);text-align:center;padding:40px 0}
  .spinner{width:28px;height:28px;border:3px solid #2a2f3d;border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* manga detail */
  .detail{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
  .detail img{width:160px;border-radius:var(--radius);flex-shrink:0}
  .detail .info{flex:1;min-width:220px}
  .detail h1{margin:0 0 8px;font-size:20px}
  .detail .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag{background:var(--bg2);border:1px solid #2a2f3d;border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
  .desc{font-size:13.5px;color:#c7cbdb;line-height:1.6;max-height:120px;overflow:auto}
  .chapters{margin-top:16px;display:flex;flex-direction:column;gap:6px}
  .chapter-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);
    border-radius:10px;padding:12px 14px;font-size:14px;border:1px solid #232838}
  .chapter-row:active{background:#20242f}
  .chapter-row .date{color:var(--muted);font-size:11.5px}

  /* reader */
  .reader{display:flex;flex-direction:column;align-items:center;background:#000;margin:-16px;padding-bottom:80px}
  .reader img{width:100%;max-width:820px;display:block}
  .reader-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,15,20,.95);backdrop-filter:blur(8px);
    display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid #1f2330;z-index:20}
  .btn{background:var(--bg2);border:1px solid #2a2f3d;color:var(--text);padding:9px 16px;border-radius:999px;
    font-size:13px;cursor:pointer;font-family:inherit}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;font-weight:600}
  .btn:disabled{opacity:.35}
  .backlink{display:inline-block;margin-bottom:10px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <a href="#/" class="logo">dz<span>manga</span></a>
  <form id="searchForm">
    <input id="searchInput" type="search" placeholder="ابحث عن مانجا…" />
  </form>
</header>
<main id="app"></main>
<script src="/app.js"></script>
</body>
</html>
