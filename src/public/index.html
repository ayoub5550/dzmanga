<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1338; --bg2:#0d1845; --card:#101c50; --text:#ffffff; --muted:#a8b4de;
    --accent:#ff2a1e; --accent2:#c11a10; --accent-grad: #ff2a1e;
    --line:color-mix(in srgb, #ff2a1e 18%, transparent);
    --line2:color-mix(in srgb, #ff2a1e 34%, transparent);
    --radius:0px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Cairo","Tahoma",-apple-system,sans-serif;}
  body{
    background-image:
      radial-gradient(ellipse at top, color-mix(in srgb, #3552d9 22%, transparent) 0%, transparent 60%),
      repeating-conic-gradient(color-mix(in srgb, #3552d9 9%, transparent) 0% 25%, transparent 0% 50%);
    background-size:auto, 3px 3px;
    background-attachment:fixed;
  }
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:#24336f;border-radius:8px}

  header{position:sticky;top:0;z-index:20;background:rgba(10,15,12,.75);backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #1e2b63;
    max-width:100%}
  header .logo{display:flex;align-items:center;gap:9px}
  .logo-badge{width:34px;height:34px;border-radius:10px;flex-shrink:0;background:var(--accent-grad);
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.55), 0 8px 22px rgba(255,42,30,.35)}
  .logo-badge svg{width:19px;height:19px}
  .logo-badge img{width:100%;height:100%;object-fit:cover;border-radius:10px}
  .logo-word{font-weight:800;font-size:18px;letter-spacing:.01em;line-height:1;
    display:flex;flex-direction:column;align-items:flex-start}
  .logo-word .top{display:flex}
  .logo-word .dz{color:var(--text)}
  .logo-word .manga{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-word .bar{width:26px;height:3px;border-radius:2px;background:var(--accent-grad);margin-top:3px}
  header form{flex:1;display:flex;min-width:0;position:relative}
  .live-results{position:absolute;top:calc(100% + 8px);right:0;left:0;background:var(--card);
    border:1px solid #24336f;border-radius:14px;max-height:70vh;overflow-y:auto;z-index:30;
    box-shadow:0 16px 40px rgba(0,0,0,.5);display:none}
  .live-results.open{display:block}
  .live-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #1e2b63}
  .live-item:last-child{border-bottom:none}
  .live-item:hover{background:#16224f}
  .live-item img{width:34px;height:48px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#1e2b63}
  .live-item .t{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live-empty{padding:14px;text-align:center;color:var(--muted);font-size:12.5px}
  header input{flex:1;min-width:0;width:100%;background:var(--card);border:1px solid #24336f;color:var(--text);
    padding:11px 14px;border-radius:999px;font-size:14px;outline:none;text-align:right;
    font-family:inherit; transition:border-color .2s, box-shadow .2s}
  header input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(6,56,74,.25)}
  header .browse-link{flex-shrink:0}
  @media (max-width: 420px){
    header{gap:8px;padding:10px 12px}
    header .logo-word{font-size:15px}
    header .browse-link{padding:9px 12px;font-size:12px}
    header input{padding:10px 12px;font-size:13px}
  }

  main{max-width:1150px;margin:0 auto;padding:0 16px 40px}

  /* hero */
  .hero{position:relative;height:280px;border-radius:20px;overflow:hidden;margin:18px 0 8px;
    background:#070d28;isolation:isolate}
  .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;display:flex;align-items:flex-end}
  .hero-slide.active{opacity:1}
  .hero-slide .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:blur(1px) brightness(.55)}
  .hero-slide .fade{position:absolute;inset:0;background:linear-gradient(0deg, rgba(10,10,15,.97) 5%, rgba(10,10,15,.35) 55%, rgba(10,10,15,.05) 100%),
    linear-gradient(90deg, rgba(10,10,15,.6), transparent 60%)}
  .hero-content{position:relative;z-index:2;padding:22px;max-width:75%}
  .hero-badge{display:inline-flex;align-items:center;gap:5px;background:var(--accent-grad);
    color:#070d28;font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:999px;
    margin-bottom:10px;letter-spacing:.02em}
  .hero-title{font-size:clamp(20px,4.5vw,30px);font-weight:800;margin:0 0 8px;line-height:1.25;
    text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .hero-cta{display:inline-flex;align-items:center;gap:6px;background:var(--accent-grad);color:#fff;
    padding:10px 20px;border-radius:999px;font-weight:700;font-size:13.5px;box-shadow:0 6px 20px rgba(143,232,189,.35)}
  .hero-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
  .hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
  .hero-dots span.active{background:#fff;width:18px;border-radius:4px}

  h2.section{font-size:16px;margin:26px 2px 12px;color:var(--text);font-weight:800;
    display:flex;align-items:center;gap:9px}
  h2.section .more{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:600}

  .micon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:19px;height:19px;color:var(--accent)}
  .micon svg{width:100%;height:100%;display:block}
  h2.section .micon{width:20px;height:20px;filter:drop-shadow(0 0 6px rgba(143,232,189,.45))}
  .hero-badge .micon{width:13px;height:13px;color:#070d28}
  .tab .micon{width:15px;height:15px;margin-inline-end:6px;color:inherit;opacity:.85}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
  .row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .row .card{flex:0 0 132px;scroll-snap-align:start}

  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;position:relative;
    transition:transform .2s ease, box-shadow .2s ease;border:1px solid #1e2b63}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(143,232,189,.18);border-color:#2e3d85}
  .card:active{transform:scale(.97)}
  .card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#16224f}
  .card .title{font-size:12.5px;padding:9px 9px 11px;line-height:1.4;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .loading, .empty{color:var(--muted);text-align:center;padding:40px 0}
  .spinner{width:30px;height:30px;border:3px solid #1e2b63;border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .skeleton{background:linear-gradient(100deg,#101a45 30%,#1e2b63 50%,#101a45 70%);
    background-size:200% 100%;animation:shimmer 1.3s infinite}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* manga detail */
  .detail{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0 10px}
  .detail img{width:170px;border-radius:var(--radius);flex-shrink:0;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .detail .info{flex:1;min-width:220px}
  .detail h1{margin:0 0 8px;font-size:21px;font-weight:800}
  .detail .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag{background:rgba(6,56,74,.15);border:1px solid rgba(6,56,74,.35);border-radius:999px;
    padding:3px 11px;font-size:11.5px;color:#f2ecdc}
  .desc{font-size:13.5px;color:#c3cdec;line-height:1.7;max-height:120px;overflow:auto}
  .chapters{margin-top:16px;display:flex;flex-direction:column;gap:7px}
  .chapter-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);
    border-radius:12px;padding:13px 15px;font-size:14px;border:1px solid #1e2b63;transition:.15s}
  .chapter-row:hover{border-color:var(--accent2)}
  .chapter-row:active{background:#16224f}
  .chapter-row .date{color:var(--muted);font-size:11.5px;flex-shrink:0;margin-inline-start:10px}
  .chapter-row .ch-title{display:block}
  .chapter-row .ch-group{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .volume-group{margin-top:14px}
  .volume-group:first-child{margin-top:0}
  .volume-label{font-size:13px;font-weight:800;color:var(--accent);margin:0 0 8px 2px}

  /* reader */
  .reader{display:flex;flex-direction:column;align-items:center;background:#000;margin:0 -16px;padding:12px 0 90px}
  .reader img{width:100%;max-width:820px;display:block}
  .reader-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,.95);backdrop-filter:blur(10px);
    display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid #1e2b63;z-index:20}
  .btn{background:var(--card);border:1px solid #24336f;color:var(--text);padding:10px 18px;border-radius:999px;
    font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
  .btn.primary{background:var(--accent-grad);border:none;font-weight:700;box-shadow:0 6px 18px rgba(143,232,189,.3)}
  .btn:disabled{opacity:.3}
  .backlink{display:inline-block;margin:14px 0 10px;color:var(--muted);font-size:13px;font-weight:600}

  /* browse tabs */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;margin-bottom:4px}
  .tab{flex:0 0 auto;display:inline-flex;align-items:center;background:var(--card);border:1px solid #1e2b63;color:var(--muted);
    padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:.15s}
  .tab.active .micon{opacity:1}
  .tab.active{background:var(--accent-grad);color:#fff;border-color:transparent}

  .pagination{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:22px 0 8px}
  .page-btn{min-width:38px;padding:9px 12px}
  .page-btn.active-page{color:#fff}
  .page-ellipsis{color:var(--muted);padding:9px 2px;font-size:13px}

  /* ---- بطاقات بشارات (شكل تطبيقات المانجا العربية) ---- */
  .card-art{position:relative}
  .card-src{position:absolute;top:6px;inset-inline-start:6px;font-size:9.5px;font-weight:800;
    padding:3px 7px;border-radius:999px;letter-spacing:.02em;backdrop-filter:blur(4px)}
  .card-src.asq{background:rgba(237,72,58,.92);color:#fff}
  .card-src.md{background:rgba(6,56,74,.9);color:#f2ecdc}
  .card-chips{position:absolute;bottom:6px;inset-inline-start:6px;display:flex;gap:4px;flex-wrap:wrap}
  .card-chip{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;
    background:rgba(10,15,12,.82);border:1px solid #29387b;color:#dfe6fa;backdrop-filter:blur(4px)}
  .card-chip.ch{background:var(--accent-grad);color:#060b24;border:none}
  h2.section .more{margin-inline-start:auto;font-size:12px;color:var(--accent);font-weight:700}

  /* ---- تابع القراءة ---- */
  .cont-row .cont-card{flex:0 0 210px;display:flex;gap:10px;background:var(--card);border:1px solid #1e2b63;
    border-radius:14px;padding:8px;align-items:center;scroll-snap-align:start;transition:.18s}
  .cont-row .cont-card:hover{border-color:var(--accent2);transform:translateY(-3px)}
  .cont-card img{width:44px;height:62px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#16224f}
  .cont-info{min-width:0}
  .cont-info .t{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cont-info .c{font-size:11.5px;color:var(--accent);margin-top:3px;font-weight:700}

  /* ---- تفاصيل المانجا ---- */
  .detail .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .dot-sep{font-size:12.5px;color:var(--muted)}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .fav-btn{display:inline-flex;align-items:center;gap:6px}
  .chapter-row.read{opacity:.55}
  .chapter-row.read .ch-title{color:var(--muted)}
  .browse-note{color:var(--muted);font-size:12.5px;padding:0 2px 14px}

  /* ---- مبدّل المصدر ---- */
  .source-switch{display:flex;gap:6px;background:var(--card);border:1px solid #1e2b63;border-radius:999px;
    padding:4px;margin:16px 0 4px;width:max-content;max-width:100%}
  .src-tab{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;
    font-size:13px;padding:8px 18px;border-radius:999px;cursor:pointer}
  .src-tab.active{background:var(--accent-grad);color:#060b24}

  /* ---- القارئ ---- */
  .reader-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .reader-chip{margin-inline-start:auto;font-size:12px;color:var(--muted);background:var(--card);
    border:1px solid #1e2b63;padding:5px 12px;border-radius:999px}
  .reader-end{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px}
  .btn.big{padding:14px 28px;font-size:15px}
  .reader-progress{position:fixed;bottom:56px;left:0;right:0;height:3px;background:#1e2b63;z-index:21}
  .reader-progress span{display:block;height:100%;width:0;background:var(--accent-grad);transition:width .1s linear}
  .live-item .src{font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:999px}
  .live-item .src.asq{background:rgba(237,72,58,.9);color:#fff}
  .live-item .src.md{background:rgba(6,56,74,.9);color:#f2ecdc}

  /* ---- شريط تنقّل سفلي (شكل تطبيق هاتف) ---- */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;
    background:rgba(10,15,12,.94);backdrop-filter:blur(12px);border-top:1px solid #1e2b63;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:12px}
  .bottom-nav a.active{color:var(--accent)}
  .bottom-nav a .micon{width:21px;height:21px;color:inherit}
  main{padding-bottom:86px}
  .reader-bar{bottom:56px}

  /* وضع القراءة الأفقي (صفحة-صفحة، تمرير أفقي بالسحب) */
  .reader.horiz{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;align-items:center;
    height:calc(100vh - 170px);padding:0;gap:0}
  .reader.horiz img{width:100vw;max-width:100vw;height:100%;object-fit:contain;
    flex:0 0 100vw;scroll-snap-align:center}
  .reader.horiz::-webkit-scrollbar{display:none}
  .mode-toggle{background:var(--card);border:1px solid #24336f;color:var(--muted);border-radius:999px;
    padding:5px 12px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .mode-toggle:hover{color:var(--text);border-color:#3a4b8f}
  /* إشعار عابر */
  .dz-toast{position:fixed;bottom:86px;left:50%;transform:translate(-50%,14px);opacity:0;
    background:rgba(23,31,26,.96);border:1px solid #29387b;color:var(--text);padding:9px 16px;
    border-radius:999px;font-size:13px;z-index:60;pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .25s ease, transform .25s ease}
  .dz-toast.show{opacity:1;transform:translate(-50%,0)}
  /* انتقال ناعم بين الشاشات */
  #app{animation:fadeUp .28s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .reader img{opacity:0;animation:imgIn .35s ease forwards}
  @keyframes imgIn{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    #app,.reader img{animation:none!important;opacity:1!important;transform:none!important}
    .dz-toast{transition:none}
  }

  /* ================= HERMES-STYLE OVERRIDE (amber terminal) ================= */
  *{border-radius:0 !important}
  ::-webkit-scrollbar-thumb{background:var(--line2)}
  body{letter-spacing:.005em}
  header{background:color-mix(in srgb,#0a1338 88%,transparent);border-bottom:1px solid var(--line)}
  header input{background:#05081f33;border:1px solid var(--line);padding:11px 14px}
  header input:focus{border-color:var(--accent);box-shadow:none}
  .logo-badge{box-shadow:none;background:transparent;width:30px;height:30px}
  .logo-word{font-family:'Cairo',sans-serif;letter-spacing:.26em;font-size:15px;text-transform:uppercase}
  .logo-word .manga{background:none;-webkit-text-fill-color:var(--accent);color:var(--accent)}
  .logo-word .dz{color:var(--text)}
  .logo-word .bar{background:var(--accent);height:2px;width:22px}

  .card,.chapter-row,.cont-row .cont-card,.live-results,.tab,.btn,.reader-chip,.source-switch,.dz-toast,.card-chip{
    background:var(--card);border:1px solid var(--line);box-shadow:none !important}
  .card:hover,.chapter-row:hover,.cont-row .cont-card:hover{border-color:var(--line2);transform:none}
  .card:hover{background:#131f56}
  .card .title{font-weight:600;letter-spacing:0}
  .card img{background:#0d1845}

  h2.section{letter-spacing:.16em;font-size:13px;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--line);padding-bottom:8px}
  h2.section .more{color:var(--accent);letter-spacing:.1em;font-size:11px}
  .micon,h2.section .micon{color:var(--accent);filter:none}

  .btn{color:var(--text);font-weight:600;letter-spacing:.12em;font-size:12px;text-transform:uppercase;padding:11px 18px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary,.tab.active,.src-tab.active,.hero-cta,.hero-badge,.card-chip.ch{
    background:var(--accent);color:#0a1338;border:1px solid var(--accent);font-weight:700}
  .tab{letter-spacing:.1em;font-size:12px;color:var(--muted);text-transform:uppercase}
  .card-src.asq{background:#d31f14;color:#fff}
  .card-src.md{background:#0a1338cc;color:var(--accent);border:1px solid var(--line2)}
  .card-chip{background:#0a1338cc;color:var(--muted)}
  .tag{background:transparent;border:1px solid var(--line);color:var(--accent)}
  .volume-label,.cont-info .c,.bottom-nav a.active{color:var(--accent)}
  .desc{color:#efeadb}
  .spinner{border-color:var(--line);border-top-color:var(--accent)}

  .hero{border:1px solid var(--line)}
  .hero-slide .fade{background:linear-gradient(0deg,#0a1338 6%,rgba(23,13,2,.45) 55%,rgba(23,13,2,.1) 100%),

  .mode-toggle{background:transparent;border:1px solid var(--line);color:var(--muted);letter-spacing:.08em}
  .mode-toggle:hover{color:var(--accent);border-color:var(--accent)}
  .source-switch{padding:4px}
  .src-tab{letter-spacing:.1em;text-transform:uppercase;font-size:12px}
  .ad-slot{margin:14px 0;min-height:0;overflow:hidden;border-radius:8px}

  /* === سمة "الفارس" — أزرق ملكي/أحمر/عاجي + ظلال حبرية (2026-08-21) === */
  .section svg, nav a svg, header .icon-btn svg{filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}

  .card{box-shadow:0 6px 0 rgba(3,6,20,.5), 0 14px 30px rgba(0,0,0,.45)}
  .btn, button{text-shadow:0 1px 0 rgba(0,0,0,.4)}
</style>
