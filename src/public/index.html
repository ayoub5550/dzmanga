<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>dzmanga — مانجا عربي</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f; --bg2:#15121e; --card:#1c1826; --text:#f3f1fa; --muted:#9791ac;
    --accent:#ff3d68; --accent2:#7c3aed; --accent-grad: linear-gradient(120deg, #ff3d68, #7c3aed);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Cairo","Tahoma",-apple-system,sans-serif;}
  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,61,104,.18), transparent 60%),
      radial-gradient(ellipse 900px 600px at 100% 0%, rgba(124,58,237,.16), transparent 55%);
    background-attachment:fixed;
  }
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:#2a2536;border-radius:8px}

  header{position:sticky;top:0;z-index:20;background:rgba(10,10,15,.75);backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #241f30}
  header .logo{font-weight:800;font-size:22px;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
  header .logo .flame{filter:drop-shadow(0 0 6px rgba(255,61,104,.7))}
  header .logo span{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  header form{flex:1;display:flex}
  header input{flex:1;background:var(--card);border:1px solid #2c2638;color:var(--text);
    padding:11px 16px;border-radius:999px;font-size:14px;outline:none;text-align:right;
    font-family:inherit; transition:border-color .2s, box-shadow .2s}
  header input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,58,237,.25)}

  main{max-width:1150px;margin:0 auto;padding:0 16px 40px}

  /* hero */
  .hero{position:relative;height:280px;border-radius:20px;overflow:hidden;margin:18px 0 8px;
    background:#0e0c14;isolation:isolate}
  .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;display:flex;align-items:flex-end}
  .hero-slide.active{opacity:1}
  .hero-slide .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:blur(1px) brightness(.55)}
  .hero-slide .fade{position:absolute;inset:0;background:linear-gradient(0deg, rgba(10,10,15,.97) 5%, rgba(10,10,15,.35) 55%, rgba(10,10,15,.05) 100%),
    linear-gradient(90deg, rgba(10,10,15,.6), transparent 60%)}
  .hero-content{position:relative;z-index:2;padding:22px;max-width:75%}
  .hero-badge{display:inline-block;background:var(--accent-grad);font-size:11.5px;font-weight:700;
    padding:4px 12px;border-radius:999px;margin-bottom:10px;letter-spacing:.02em}
  .hero-title{font-size:clamp(20px,4.5vw,30px);font-weight:800;margin:0 0 8px;line-height:1.25;
    text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .hero-cta{display:inline-flex;align-items:center;gap:6px;background:var(--accent-grad);color:#fff;
    padding:10px 20px;border-radius:999px;font-weight:700;font-size:13.5px;box-shadow:0 6px 20px rgba(255,61,104,.35)}
  .hero-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
  .hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
  .hero-dots span.active{background:#fff;width:18px;border-radius:4px}

  h2.section{font-size:16px;margin:26px 2px 12px;color:var(--text);font-weight:800;
    display:flex;align-items:center;gap:8px}
  h2.section .icon{filter:drop-shadow(0 0 6px rgba(255,61,104,.5))}
  h2.section .more{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
  .row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .row .card{flex:0 0 132px;scroll-snap-align:start}

  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;position:relative;
    transition:transform .2s ease, box-shadow .2s ease;border:1px solid #241f30}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(255,61,104,.18);border-color:#3a2f4a}
  .card:active{transform:scale(.97)}
  .card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#221d2c}
  .card .title{font-size:12.5px;padding:9px 9px 11px;line-height:1.4;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .loading, .empty{color:var(--muted);text-align:center;padding:40px 0}
  .spinner{width:30px;height:30px;border:3px solid #241f30;border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .skeleton{background:linear-gradient(100deg,#1c1826 30%,#241f30 50%,#1c1826 70%);
    background-size:200% 100%;animation:shimmer 1.3s infinite}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* manga detail */
  .detail{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0 10px}
  .detail img{width:170px;border-radius:var(--radius);flex-shrink:0;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .detail .info{flex:1;min-width:220px}
  .detail h1{margin:0 0 8px;font-size:21px;font-weight:800}
  .detail .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.35);border-radius:999px;
    padding:3px 11px;font-size:11.5px;color:#cbb9ff}
  .desc{font-size:13.5px;color:#c7c2d6;line-height:1.7;max-height:120px;overflow:auto}
  .chapters{margin-top:16px;display:flex;flex-direction:column;gap:7px}
  .chapter-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);
    border-radius:12px;padding:13px 15px;font-size:14px;border:1px solid #241f30;transition:.15s}
  .chapter-row:hover{border-color:var(--accent2)}
  .chapter-row:active{background:#221d2c}
  .chapter-row .date{color:var(--muted);font-size:11.5px}

  /* reader */
  .reader{display:flex;flex-direction:column;align-items:center;background:#000;margin:0 -16px;padding:12px 0 90px}
  .reader img{width:100%;max-width:820px;display:block}
  .reader-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,.95);backdrop-filter:blur(10px);
    display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid #241f30;z-index:20}
  .btn{background:var(--card);border:1px solid #2c2638;color:var(--text);padding:10px 18px;border-radius:999px;
    font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
  .btn.primary{background:var(--accent-grad);border:none;font-weight:700;box-shadow:0 6px 18px rgba(255,61,104,.3)}
  .btn:disabled{opacity:.3}
  .backlink{display:inline-block;margin:14px 0 10px;color:var(--muted);font-size:13px;font-weight:600}
</style>
</head>
<body>
<header>
  <a href="#/" class="logo"><span class="flame">🔥</span>dz<span>manga</span></a>
  <form id="searchForm">
    <input id="searchInput" type="search" placeholder="ابحث عن مانجا…" />
  </form>
</header>
<main id="app"></main>
<script src="/app.js"></script>
</body>
</html>
